# Use this on a VPS where Traefik already owns ports 80/443 (Hostinger Docker Manager):
#   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose -f docker-compose.traefik.yml up -d --build
# Hostinger's Traefik runs in host network mode with entrypoint "websecure" and cert resolver
# "letsencrypt" (copied from an existing app's labels), and *.srvXXXX.hstgr.cloud resolves to the VPS.
# Set DOMAIN in .env, e.g. polartrap.srv2160743.hstgr.cloud
services:
  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    env_file: .env
    volumes:
      - pt_data:/data
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.polartrap.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.polartrap.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.polartrap.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.polartrap.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pt_data:
